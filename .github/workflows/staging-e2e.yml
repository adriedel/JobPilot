name: Staging Smoke Tests

# Läuft automatisch, sobald Vercel ein Preview-/Staging-Deployment fertig hat,
# und testet genau diese URL (inkl. echtem Staging-Backend).
# Kann auch manuell mit beliebiger URL gestartet werden (Actions → Run workflow).
#
# Benötigt (Settings → Secrets and variables → Actions):
#   Variables: STAGING_API_URL                 z.B. https://jobpilot-backend-staging.onrender.com
#   Secrets:   E2E_USER_EMAIL, E2E_USER_PASSWORD  (Test-Account auf Staging, optional)
#              VERCEL_AUTOMATION_BYPASS_SECRET    (nur falls Deployment Protection aktiv)

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: "URL, gegen die getestet wird"
        required: true
        default: "https://staging.bewerbungstracker.com"

jobs:
  smoke:
    # Nur erfolgreiche Deployments, nie Produktion
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment != 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: JobPilot/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: JobPilot/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run smoke tests
        env:
          HOME: /root
          PLAYWRIGHT_BASE_URL: ${{ github.event.inputs.url || github.event.deployment_status.environment_url }}
          E2E_API_URL: ${{ vars.STAGING_API_URL }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          echo "Teste gegen: $PLAYWRIGHT_BASE_URL"
          npx playwright test

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: staging-playwright-report
          path: JobPilot/frontend/playwright-report/
          retention-days: 14
