# Security-Header für das lokale Docker-Setup (Vercel: siehe vercel.json).
# Wird in jeden location-Block eingebunden, weil nginx add_header aus dem
# server-Block nicht erbt, sobald eine location eigene add_header setzt.
# connect-src muss zur API-URL passen (VITE_API_URL in docker-compose.yml).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://api.dicebear.com https://res.cloudinary.com; font-src 'self'; connect-src 'self' http://localhost:3001; frame-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
