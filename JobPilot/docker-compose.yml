services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: jobpilot
      POSTGRES_USER: jobpilot
      POSTGRES_PASSWORD: jobpilot
    ports:
      # Host-Port 5433, damit es nicht mit anderen lokalen Postgres-Instanzen
      # (Standard-Port 5432) kollidiert. Im Docker-Netz bleibt es db:5432.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobpilot -d jobpilot"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Optional: eigene Werte (z. B. RESEND_API_KEY) aus backend/.env.
    # Die Werte unter "environment" haben Vorrang.
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://jobpilot:jobpilot@db:5432/jobpilot
      JWT_SECRET: docker_demo_secret_change_me
      FRONTEND_URLS: http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173
      FRONTEND_URL: http://localhost:8080
      FROM_EMAIL: info@bewerbungstracker.com
      # Lokale Test-Accounts (admin@jobpilot.test usw., siehe backend/seed.js)
      SEED_DEMO_DATA: "true"
      SEED_PASSWORD: jobpilot-lokal
      # RESEND_API_KEY optional aus backend/.env – ohne Key landen Mails
      # (Bestätigungs-/Reset-Links) im Backend-Log: docker compose logs -f backend
    ports:
      - "3001:3001"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3001/api
        # Für die Abgabe/Demo direkt ohne Login sichtbar.
        # Auf "false" setzen, wenn die Demo-Funktionalität nicht benötigt wird.
        VITE_DEMO_MODE: "false"
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  postgres_data:
